<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#73c9ff">
<title>Где спрятался малыш?</title>
<style>
:root{--blue:#55bdf5;--deep:#244b75;--green:#4fc477;--yellow:#ffd45b;--cream:#fffdf7}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Nunito,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#dff5ff;color:var(--deep)}
body{touch-action:manipulation}
button{font:inherit;border:0;cursor:pointer}
#app{width:100%;height:100dvh;position:relative;overflow:hidden}
.screen{position:absolute;inset:0;display:none}
.screen.active{display:flex}
.bg{position:absolute;inset:0;background:linear-gradient(#8bdcff 0 43%,#bfe98c 43% 100%)}
.cloud{position:absolute;background:#fff;border-radius:999px;opacity:.8;filter:blur(.2px)}
.cloud:before,.cloud:after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud:before{width:55%;height:130%;left:15%;top:-55%}.cloud:after{width:45%;height:110%;right:10%;top:-35%}
.c1{width:125px;height:30px;top:12%;left:5%}.c2{width:150px;height:35px;top:19%;right:5%}
.logo{font-size:clamp(32px,9vw,66px);font-weight:1000;line-height:.95;text-align:center;color:#fff;text-shadow:0 5px 0 #3b88c4,0 8px 18px #2470a955;max-width:800px;margin:auto}
.logo small{display:block;font-size:.34em;line-height:1.25;margin-top:18px;text-shadow:none;color:#285a80;background:#fff;border-radius:999px;padding:9px 18px;width:max-content;max-width:90%;margin-left:auto;margin-right:auto}
.home-content{position:relative;z-index:2;width:min(920px,94%);margin:auto;display:flex;flex-direction:column;align-items:center;gap:18px;padding-top:5vh}
.play{background:linear-gradient(#6cda8b,#3db967);color:#fff;font-size:clamp(21px,5vw,30px);font-weight:1000;padding:15px 42px;border-radius:22px;box-shadow:0 6px 0 #28954e,0 12px 25px #277a4b40}
.play:active,.level:active,.smallbtn:active{transform:translateY(3px);box-shadow:0 3px 0 #278e4b}
.character{font-size:100px;filter:drop-shadow(0 8px 5px #0002);animation:bob 2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}

#map{background:#8fd8ff}
.map-bg{position:absolute;inset:0;background:linear-gradient(#86d8ff 0 35%,#a9df77 35% 100%)}
.map-title{position:absolute;top:max(14px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:#fff;border:4px solid #fff;border-radius:22px;padding:10px 20px;font-size:clamp(20px,5vw,34px);font-weight:1000;box-shadow:0 5px 18px #276b9940;z-index:5;white-space:nowrap}
.path{position:absolute;width:8px;background:#e5c47c;border-radius:99px;transform-origin:top center;box-shadow:0 0 0 3px #fff5}
.level{position:absolute;width:120px;height:120px;border-radius:50%;background:#fff;border:7px solid #fff;box-shadow:0 7px 0 #d1d7df,0 12px 24px #255b7440;display:flex;align-items:center;justify-content:center;flex-direction:column;font-weight:1000;color:#315b79;font-size:15px}
.level .ico{font-size:54px;line-height:1}
.level.locked{filter:grayscale(.6);opacity:.7}
.l1{left:10%;top:22%}.l2{left:40%;top:38%}.l3{right:10%;top:28%}.l4{left:18%;top:61%}.l5{right:18%;top:67%}
.stickers{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);background:#fff;border-radius:22px;padding:10px 18px;font-weight:900;box-shadow:0 6px 18px #0002;z-index:5}
#game{background:#d8f2ff}
.game-ui{position:absolute;top:max(8px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:min(680px,94%);z-index:20;display:flex;align-items:center;gap:8px}
.pill{background:#fff;border-radius:22px;padding:9px 15px;box-shadow:0 5px 18px #245c7725;font-weight:1000}
.taskpill{flex:1;text-align:center;font-size:clamp(16px,4vw,23px)}
.iconbtn{width:48px;height:48px;border-radius:16px;background:#fff;font-size:22px;box-shadow:0 5px 18px #245c7725}
.scene{position:absolute;inset:0;overflow:hidden}
.scene svg{width:100%;height:100%;display:block}
.target{cursor:pointer}
.target.found{animation:found .45s ease forwards}
@keyframes found{45%{transform:scale(1.25)}100%{transform:scale(.65);opacity:.35}}
.hint{position:absolute;bottom:max(12px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:20;display:flex;gap:10px;align-items:center;background:#fff;border-radius:20px;padding:10px 15px;box-shadow:0 6px 20px #1c4f6530;font-weight:900}
.hint button{background:#ffd55f;border-radius:14px;padding:8px 13px;font-weight:1000;color:#6e4e00}
.win{position:absolute;inset:0;background:#214a76cc;z-index:50;display:none;align-items:center;justify-content:center;padding:20px}
.win.show{display:flex}
.win-card{background:#fff;border-radius:30px;padding:28px 22px;text-align:center;width:min(400px,92%);box-shadow:0 20px 60px #0004}
.win-card .big{font-size:70px}.win-card h2{font-size:30px;margin:8px 0;color:#244b75}.win-card p{color:#63809a;font-weight:700}
.stars{font-size:42px;letter-spacing:3px}
.next{background:#52c977;color:#fff;border-radius:17px;padding:13px 25px;font-size:19px;font-weight:1000;box-shadow:0 5px 0 #2d9b51}
.back{background:#eef6fb;color:#315b79;border-radius:15px;padding:10px 15px;font-weight:900;margin-top:9px}
.toast{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#fff;border-radius:20px;padding:14px 20px;font-weight:1000;box-shadow:0 8px 30px #0003;z-index:40;display:none}
.toast.show{display:block;animation:toast .9s ease forwards}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-35%) scale(.8)}20%,70%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-65%) scale(1)}}
@media(max-width:520px){
 .level{width:94px;height:94px}.level .ico{font-size:42px}.l1{left:5%}.l2{left:36%}.l3{right:5%}.l4{left:7%}.l5{right:7%}
 .character{font-size:80px}.home-content{padding-top:11vh}
}
</style>
</head>
<body>
<div id="app">

<section id="home" class="screen active">
 <div class="bg"><div class="cloud c1"></div><div class="cloud c2"></div></div>
 <div class="home-content">
  <div class="character">🦝</div>
  <div class="logo">Где спрятался<br>малыш?<small>Ищем · играем · развиваем внимание</small></div>
  <button class="play" onclick="showMap()">Играть ▶</button>
 </div>
</section>

<section id="map" class="screen">
 <div class="map-bg"></div>
 <div class="map-title">🗺️ Путешествие</div>
 <div class="path" style="height:180px;left:31%;top:28%;transform:rotate(38deg)"></div>
 <div class="path" style="height:180px;left:57%;top:38%;transform:rotate(95deg)"></div>
 <div class="path" style="height:170px;left:47%;top:54%;transform:rotate(-65deg)"></div>
 <button class="level l1" onclick="startLevel('park')"><span class="ico">🌳</span>1. Парк</button>
 <button class="level l2" onclick="startLevel('farm')"><span class="ico">🚜</span>2. Ферма</button>
 <button class="level l3" onclick="startLevel('sea')"><span class="ico">🏖️</span>3. Море</button>
 <button class="level l4" onclick="startLevel('home')"><span class="ico">🏠</span>4. Дом</button>
 <button class="level l5 locked" onclick="locked()">🔒</button>
 <div class="stickers">⭐ Собрано наклеек: <span id="stickerCount">0</span> / 5</div>
</section>

<section id="game" class="screen">
 <div class="scene" id="scene"></div>
 <div class="game-ui">
  <button class="iconbtn" onclick="showMap()">‹</button>
  <div class="pill taskpill" id="task">Найди всех утят 🐥</div>
  <div class="pill" id="count">0 / 5</div>
  <button class="iconbtn" onclick="hint()">💡</button>
 </div>
 <div class="hint"><span id="hintText">Ищи внимательно!</span><button onclick="hint()">Подсказка</button></div>
 <div class="toast" id="toast"></div>
 <div class="win" id="win">
  <div class="win-card">
   <div class="big" id="winEmoji">🎉</div>
   <div class="stars">⭐ ⭐ ⭐</div>
   <h2>Ты всё нашёл!</h2>
   <p id="winText">Отличная работа!</p>
   <button class="next" onclick="nextLevel()">Следующий уровень →</button><br>
   <button class="back" onclick="showMap()">На карту</button>
  </div>
 </div>
</section>

</div>
<script>
const NS="http://www.w3.org/2000/svg";
let levelKey="park", objects=[], found=0, hintUsed=false, completed=new Set();

const levels={
 park:{title:"Помоги Мише найти всех утят 🐥", target:"duck", label:"утят", total:5},
 farm:{title:"Найди все машинки 🚗", target:"car", label:"машинки", total:5},
 sea:{title:"Найди всех морских звёзд ⭐", target:"star", label:"морских звёзд", total:5},
 home:{title:"Найди 5 красных предметов 🔴", target:"red", label:"красных предметов", total:5}
};

function screen(id){document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));document.getElementById(id).classList.add("active")}
function showMap(){document.getElementById("win").classList.remove("show");screen("map")}
function locked(){toast("Эта локация откроется скоро 🔒")}
function toast(t){const x=document.getElementById("toast");x.textContent=t;x.classList.add("show");setTimeout(()=>x.classList.remove("show"),950)}
function svg(tag,a={},p){const e=document.createElementNS(NS,tag);Object.entries(a).forEach(([k,v])=>e.setAttribute(k,v));if(p)p.appendChild(e);return e}
function txt(p,x,y,t,size=30){const e=svg("text",{x,y,"font-size":size,"text-anchor":"middle","font-weight":900,"font-family":"system-ui"},p);e.textContent=t;return e}
function addTarget(g,type,x,y){g.classList.add("target");g.dataset.type=type;objects.push({g,type,x,y,found:false});g.addEventListener("pointerdown",e=>pick(objects.find(o=>o.g===g),e))}
function pick(o,e){
 if(!o||o.found)return;
 if(o.type!==levels[levelKey].target){toast("Не это! Продолжай искать 👀");return}
 o.found=true;o.g.classList.add("found");found++;update();
 if(found===levels[levelKey].total)setTimeout(win,450);
}
function baseScene(s){
 svg("rect",{x:0,y:0,width:800,height:1000,fill:"#9bdcff"},s);
 svg("circle",{cx:690,cy:100,r:58,fill:"#ffd75b"},s);
 [[90,110],[190,80],[300,130]].forEach(([x,y])=>{svg("circle",{cx:x,cy:y,r:35,fill:"#fff"},s);svg("circle",{cx:x+35,cy:y+8,r:27,fill:"#fff"},s)});
}
function parkScene(s){
 baseScene(s); svg("path",{d:"M0 430 Q180 300 360 430 T800 400 V1000 H0Z",fill:"#7fcf72"},s);svg("rect",{x:0,y:610,width:800,height:390,fill:"#a9df7e"},s);
 svg("path",{d:"M0 760 Q200 690 400 770 T800 720 L800 900 Q600 850 400 920 T0 890Z",fill:"#7e818a"},s);
 // trees
 [[90,500,75],[710,470,80],[560,400,60]].forEach(([x,y,r])=>{svg("rect",{x:x-15,y:y+40,width:30,height:150,fill:"#865c3d",rx:8},s);svg("circle",{cx:x,cy:y,r,fill:"#53b967"},s);svg("circle",{cx:x-45,cy:y+20,r:r*.65,fill:"#65c875"},s)});
 // slide
 svg("rect",{x:500,y:550,width:30,height:170,fill:"#e45c4f",rx:12},s);svg("path",{d:"M520 700 Q580 700 630 760 H500Z",fill:"#f07b61"},s);
 // bridge
 svg("path",{d:"M120 850 Q250 770 380 850 L380 900 Q250 830 120 900Z",fill:"#a36d3d"},s);
 // duck targets
 [[160,690],[335,610],[650,650],[270,870],[610,840]].forEach(([x,y])=>duck(s,x,y));
 // extras
 txt(s,110,780,"⚽",44);txt(s,420,700,"🧸",42);txt(s,720,760,"🎈",44);txt(s,420,470,"🪁",45);txt(s,730,560,"🐱",46);txt(s,250,520,"🐶",46);
}
function duck(s,x,y){
 const g=svg("g",{transform:`translate(${x} ${y})`},s);svg("ellipse",{cx:0,cy:18,rx:25,ry:18,fill:"#ffd84d",stroke:"#a97622","stroke-width":3},g);svg("circle",{cx:5,cy:-3,r:17,fill:"#ffd84d",stroke:"#a97622","stroke-width":3},g);svg("circle",{cx:11,cy:-7,r:3,fill:"#222"},g);svg("path",{d:"M20 -2 l18 7 l-18 6z",fill:"#f08c32"},g);addTarget(g,"duck",x,y)}
function farmScene(s){
 baseScene(s);svg("rect",{x:0,y:570,width:800,height:430,fill:"#b9df76"},s);svg("path",{d:"M0 620 Q180 500 350 620 T800 590 V720 H0Z",fill:"#82c96b"},s);
 // barn
 svg("path",{d:"M80 560 L220 450 L360 560Z",fill:"#e85c50"},s);svg("rect",{x:100,y:560,width:240,height:170,fill:"#fff0d5",stroke:"#9d5b43","stroke-width":5},s);txt(s,220,675,"🚪",72);
 // cars
 [[140,820,"#ef6257"],[400,790,"#4f9bea"],[650,840,"#ffd14d"],[560,650,"#64c77a"],[280,900,"#f08b3c"]].forEach(([x,y,c])=>car(s,x,y,c));
 txt(s,470,500,"🐮",55);txt(s,730,570,"🐷",50);txt(s,70,710,"🐔",45);txt(s,440,920,"🌻",48);
}
function car(s,x,y,c){
 const g=svg("g",{transform:`translate(${x} ${y})`},s);svg("rect",{x:-55,y:-25,width:110,height:48,rx:12,fill:c,stroke:"#344b5b","stroke-width":4},g);svg("path",{d:"M-35 -25 L-15 -53 L25 -53 L43 -25Z",fill:c,stroke:"#344b5b","stroke-width":4},g);svg("circle",{cx:-32,cy:24,r:13,fill:"#333"},g);svg("circle",{cx:32,cy:24,r:13,fill:"#333"},g);svg("rect",{x:-8,y:-47,width:28,height:17,fill:"#b9e8f5",rx:3},g);addTarget(g,"car",x,y)}
function seaScene(s){
 baseScene(s);svg("rect",{x:0,y:430,width:800,height:570,fill:"#58c8e8"},s);svg("path",{d:"M0 420 Q180 380 360 430 T800 420 V510 H0Z",fill:"#ffe5a8"},s);
 txt(s,95,500,"⛱️",70);txt(s,700,540,"🛟",65);txt(s,400,560,"🐢",55);txt(s,620,700,"🐠",55);txt(s,180,720,"🐟",55);txt(s,500,850,"🐙",60);
 [[130,620],[300,760],[470,640],[670,820],[560,930]].forEach(([x,y])=>star(s,x,y));
}
function star(s,x,y){
 const g=svg("g",{transform:`translate(${x} ${y})`},s);svg("path",{d:"M0-28 L8-9 L29-9 L13 3 L19 25 L0 13 L-19 25 L-13 3 L-29-9 L-8-9Z",fill:"#ffbd4a",stroke:"#9a6b2c","stroke-width":4},g);addTarget(g,"star",x,y)}
function homeScene(s){
 baseScene(s);svg("rect",{x:0,y:430,width:800,height:570,fill:"#f8dfbd"},s);svg("rect",{x:120,y:220,width:560,height:600,rx:20,fill:"#fff6e8",stroke:"#d18b61","stroke-width":8},s);svg("path",{d:"M90 230 L400 70 L710 230Z",fill:"#df7059"},s);svg("rect",{x:350,y:550,width:100,height:270,fill:"#8d624d"},s);
 txt(s,205,380,"🧸",65);txt(s,590,360,"📚",60);txt(s,190,600,"🍎",55);txt(s,590,600,"🔴",60);txt(s,400,410,"🎈",55);
 [[280,720,"#ef5350"],[500,730,"#e95d50"],[340,520,"#e84e4e"],[520,480,"#e95555"],[420,880,"#e84d4d"]].forEach(([x,y,c])=>redTarget(s,x,y,c));
}
function redTarget(s,x,y,c){const g=svg("g",{transform:`translate(${x} ${y})`},s);svg("circle",{cx:0,cy:0,r:24,fill:c,stroke:"#a22","stroke-width":4},g);addTarget(g,"red",x,y)}
function draw(){
 const s=document.createElementNS(NS,"svg");s.setAttribute("viewBox","0 0 800 1000");s.setAttribute("preserveAspectRatio","xMidYMid slice");
 objects=[];({park:parkScene,farm:farmScene,sea:seaScene,home:homeScene}[levelKey])(s);
 document.getElementById("scene").replaceChildren(s);
}
function startLevel(k){levelKey=k;found=0;hintUsed=false;document.getElementById("win").classList.remove("show");draw();update();screen("game")}
function update(){const l=levels[levelKey];document.getElementById("task").textContent=l.title;document.getElementById("count").textContent=`${found} / ${l.total}`}
function hint(){
 const remaining=objects.find(o=>o.type===levels[levelKey].target&&!o.found);if(!remaining){toast("Всё уже найдено!");return}
 hintUsed=true;remaining.g.animate([{filter:"drop-shadow(0 0 0px #fff)"},{filter:"drop-shadow(0 0 18px #fff) drop-shadow(0 0 18px #ffca3a)"},{filter:"drop-shadow(0 0 0px #fff)"}],{duration:900,iterations:2});
 document.getElementById("hintText").textContent="Посмотри туда, где мигает ⭐";
}
function win(){
 document.getElementById("winEmoji").textContent=levelKey==="sea"?"🌟":levelKey==="farm"?"🚜":"🎉";
 document.getElementById("winText").textContent=hintUsed?"Нашёл! В следующий раз попробуй без подсказки.":"Отличная работа! Ты очень внимательный.";
 document.getElementById("win").classList.add("show");completed.add(levelKey);document.getElementById("stickerCount").textContent=completed.size;
}
function nextLevel(){const order=["park","farm","sea","home"];let i=order.indexOf(levelKey);if(i<order.length-1)startLevel(order[i+1]);else showMap()}
</script>
</body>
</html>
