<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#6c63ff">
<title>Найди всё!</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f7f7ff;color:#24243a}
body{touch-action:manipulation}
.app{height:100dvh;display:flex;flex-direction:column}
.top{padding:max(10px,env(safe-area-inset-top)) 14px 10px;background:#fff;box-shadow:0 2px 12px #00000012;z-index:5}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{font-size:24px;margin:0;font-weight:900}
.task{margin-top:8px;background:#f0efff;border-radius:18px;padding:10px 14px;font-size:18px;font-weight:800;display:flex;align-items:center;gap:8px}
.task b{color:#5a4ff5}
.stats{font-size:14px;font-weight:800;color:#68687d}
button{border:0;background:#eeeef8;border-radius:14px;padding:9px 12px;font-weight:800;font-size:14px;color:#33334a}
.scene-wrap{flex:1;min-height:0;padding:10px;display:flex;align-items:center;justify-content:center}
.scene{width:min(100%,720px);height:100%;max-height:760px;border-radius:24px;overflow:hidden;box-shadow:0 8px 30px #34345a18;background:#dff5ff;position:relative}
svg{display:block;width:100%;height:100%;user-select:none}
.hit{cursor:pointer}
.hit.found{animation:pop .35s ease forwards}
@keyframes pop{50%{transform:scale(1.18)}100%{opacity:.35;filter:saturate(.3)}}
.spark{position:absolute;pointer-events:none;font-size:28px;animation:spark .65s ease-out forwards}
@keyframes spark{from{transform:translate(-50%,-50%) scale(.5);opacity:1}to{transform:translate(-50%,-110px) scale(1.3);opacity:0}}
.overlay{position:absolute;inset:0;background:#24243acc;display:none;align-items:center;justify-content:center;padding:25px;z-index:10}
.card{background:white;border-radius:28px;padding:28px;text-align:center;max-width:360px;width:100%;box-shadow:0 15px 50px #0004}
.card .emoji{font-size:60px}
.card h2{font-size:30px;margin:8px 0}
.card p{color:#68687d;font-weight:600}
.primary{background:#6c63ff;color:white;font-size:18px;padding:13px 20px;border-radius:17px}
.legend{font-size:12px;color:#85859a;text-align:center;padding-bottom:8px}
@media (min-width:700px){h1{font-size:28px}.task{font-size:20px}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="row">
      <h1>🔎 Найди всё!</h1>
      <div class="row" style="gap:6px"><span class="stats" id="stats">0 / 0</span><button id="newBtn">Новая игра</button></div>
    </div>
    <div class="task" id="task">Загрузка…</div>
  </header>
  <main class="scene-wrap">
    <div class="scene" id="scene"></div>
  </main>
  <div class="legend">Нажимай на предметы пальцем. Ошибиться нельзя!</div>
</div>
<div class="overlay" id="overlay">
  <div class="card">
    <div class="emoji">🎉</div>
    <h2>Ура! Всё найдено!</h2>
    <p id="result"></p>
    <button class="primary" id="again">Играть ещё</button>
  </div>
</div>

<script>
const NS="http://www.w3.org/2000/svg";
const tasks=[
  {name:"красные предметы", color:"#ef5350", emoji:"🔴", filter:o=>o.color==="red"},
  {name:"машины", emoji:"🚗", type:"car", filter:o=>o.type==="car"},
  {name:"арбузы", emoji:"🍉", type:"watermelon", filter:o=>o.type==="watermelon"},
  {name:"жёлтые предметы", color:"#f7c948", emoji:"🟡", filter:o=>o.color==="yellow"},
  {name:"мячики", emoji:"⚽", type:"ball", filter:o=>o.type==="ball"}
];

let objects=[], currentTask, found=0;

function el(tag,attrs={},parent){
  const e=document.createElementNS(NS,tag);
  for(const [k,v] of Object.entries(attrs)) e.setAttribute(k,v);
  if(parent) parent.appendChild(e);
  return e;
}
function svgText(parent,x,y,text,size=24,weight=700,anchor="middle"){
  const t=el("text",{x,y,"font-size":size,"font-weight":weight,"text-anchor":anchor,"font-family":"system-ui"},parent);
  t.textContent=text; return t;
}
function addObj(o){
  objects.push(o);
}
function rect(x,y,w,h,fill,rx=10){
  const r=el("rect",{x,y,width:w,height:h,fill,rx}); return r;
}
function drawScene(){
  objects=[];
  const s=document.createElementNS(NS,"svg");
  s.setAttribute("viewBox","0 0 800 1000");
  s.setAttribute("preserveAspectRatio","xMidYMid meet");
  // sky
  el("rect",{x:0,y:0,width:800,height:1000,fill:"#d9f3ff"},s);
  // sun and clouds
  el("circle",{cx:700,cy:105,r:58,fill:"#ffd95a"},s);
  [[100,110],[190,80],[290,125]].forEach(([x,y],i)=>{el("circle",{cx:x,cy:y,r:34,fill:"#fff"},s);el("circle",{cx:x+35,cy:y+8,r:27,fill:"#fff"},s);});
  // hills
  el("path",{d:"M0 390 Q170 270 340 390 T800 350 V560 H0Z",fill:"#9bd77b"},s);
  el("path",{d:"M0 470 Q180 350 360 470 T800 430 V650 H0Z",fill:"#79c96b"},s);
  // ground
  el("rect",{x:0,y:560,width:800,height:440,fill:"#bfe68c"},s);
  // road
  el("path",{d:"M0 760 Q210 700 400 780 T800 720 L800 930 Q590 870 400 920 T0 900Z",fill:"#777b87"},s);
  el("path",{d:"M0 825 Q210 770 400 840 T800 790",fill:"none",stroke:"#fff", "stroke-width":12,"stroke-dasharray":"35 28"},s);

  // house
  el("path",{d:"M70 610 L180 515 L290 610Z",fill:"#e7795d"},s);
  rect(90,610,180,135,"#fff0d2",8).setAttribute("stroke","#7b5c45");
  rect(160,660,45,85,"#8b6b55",6);
  rect(105,630,45,38,"#72c6e8",5); rect(215,630,45,38,"#72c6e8",5);

  // tree
  el("rect",{x:650,y:470,width:34,height:170,fill:"#8b603f",rx:10},s);
  [[650,450,65],[710,465,58],[685,405,62]].forEach(a=>el("circle",{cx:a[0],cy:a[1],r:a[2],fill:"#5bbd67"},s));

  // flower patches
  [[330,625,"#ff6b8a"],[360,650,"#ffd34d"],[430,610,"#8b7cff"],[470,650,"#ff6b8a"],[550,600,"#ffd34d"],[585,640,"#8b7cff"]].forEach(([x,y,c])=>{
    el("line",{x1:x,y1:y,x2:x,y2:y+35,stroke:"#559d50","stroke-width":6},s);
    el("circle",{cx:x,cy:y,r:10,fill:c},s);
  });

  // objects: cars
  const cars=[[360,735,"red"],[590,780,"blue"],[250,850,"yellow"]];
  cars.forEach(([x,y,c],i)=>{ 
    const g=el("g",{class:"hit",transform:`translate(${x} ${y})`},s);
    rect(-55,-28,110,45,c,12).setAttribute("stroke","#333");
    el("path",{d:"M-32 -28 L-15 -58 L25 -58 L43 -28Z",fill:c,stroke:"#333"},g);
    el("circle",{cx:-32,cy:20,r:13,fill:"#333"},g);el("circle",{cx:32,cy:20,r:13,fill:"#333"},g);
    el("rect",{x:-8,y:-51,width:27,height:18,fill:"#b9e7f4",rx:4},g);
    addObj({type:"car",color:c==="red"?"red":c==="yellow"?"yellow":"blue",x,y,g});
  });

  // watermelons
  [[520,880],[690,700],[115,850],[430,720]].forEach(([x,y],i)=>{
    const g=el("g",{class:"hit",transform:`translate(${x} ${y})`},s);
    el("path",{d:"M-28 0 Q0 -45 28 0 Q0 35 -28 0Z",fill:"#4caf50",stroke:"#275d2b","stroke-width":4},g);
    el("path",{d:"M-21 -2 Q0 -34 21 -2",fill:"none",stroke:"#eaf27a","stroke-width":4},g);
    [-10,2,13].forEach(xx=>el("ellipse",{cx:xx,cy:-7,rx:2,ry:6,fill:"#222"},g));
    addObj({type:"watermelon",color:"green",x,y,g});
  });

  // balls
  [[330,920],[90,780],[735,900]].forEach(([x,y],i)=>{
    const g=el("g",{class:"hit",transform:`translate(${x} ${y})`},s);
    el("circle",{cx:0,cy:0,r:25,fill:i===0?"#ffcc4d":i===1?"#ef5350":"#69a8ff",stroke:"#444","stroke-width":4},g);
    el("path",{d:"M-12 -20 Q0 -5 12 -20 M-22 5 Q0 18 22 5",fill:"none",stroke:"#fff","stroke-width":4},g);
    addObj({type:"ball",color:i===1?"red":i===0?"yellow":"blue",x,y,g});
  });

  // extra objects
  const extras=[
    ["🍎",470,525],["🐶",350,545],["🦋",590,520],["🎈",315,475],["🌻",745,585],
    ["🧸",320,675],["🪁",470,455],["🍦",620,620],["📚",300,735],["🛴",720,610]
  ];
  extras.forEach(([emoji,x,y])=>{
    const g=el("g",{class:"hit",transform:`translate(${x} ${y})`},s);
    svgText(g,0,0,emoji,42);
    addObj({type:"extra",color:"other",x,y,g});
  });

  document.getElementById("scene").replaceChildren(s);
  objects.forEach(o=>o.g.addEventListener("click",e=>handle(o,e)));
}
function chooseTask(){
  currentTask=tasks[Math.floor(Math.random()*tasks.length)];
  found=0;
  // Make sure the chosen task has at least 3 items.
  if(objects.filter(currentTask.filter).length<3) return chooseTask();
  updateUI();
}
function updateUI(){
  const total=objects.filter(currentTask.filter).length;
  document.getElementById("task").innerHTML=`${currentTask.emoji} Найди <b>все ${currentTask.name}</b>`;
  document.getElementById("stats").textContent=`${found} / ${total}`;
}
function handle(o,e){
  if(!currentTask.filter(o) || o.g.classList.contains("found")) return;
  o.g.classList.add("found");
  found++;
  const scene=document.getElementById("scene");
  const r=scene.getBoundingClientRect();
  const x=e.clientX-r.left,y=e.clientY-r.top;
  const sp=document.createElement("div"); sp.className="spark"; sp.textContent="✨"; sp.style.left=x+"px";sp.style.top=y+"px";scene.appendChild(sp);
  setTimeout(()=>sp.remove(),700);
  updateUI();
  const total=objects.filter(currentTask.filter).length;
  if(found===total) setTimeout(win,400);
}
function win(){
  document.getElementById("result").textContent=`Ты нашёл ${found} предметов. Попробуем новую картинку?`;
  document.getElementById("overlay").style.display="flex";
}
function newGame(){
  document.getElementById("overlay").style.display="none";
  drawScene(); chooseTask();
}
document.getElementById("newBtn").onclick=newGame;
document.getElementById("again").onclick=newGame;
newGame();
</script>
</body>
</html>
