<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#72cfff">
<title>Где спрятался малыш?</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#dff5ff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{touch-action:manipulation}
#app{height:100dvh;width:100%;position:relative;overflow:hidden;background:#dff5ff}
.screen{position:absolute;inset:0;display:none;align-items:center;justify-content:center}
.screen.active{display:flex}
.art{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center;background:#bfeeff}
.hot{position:absolute;border:0;background:transparent;cursor:pointer;border-radius:30px}
.hot:active{background:#fff3;outline:3px solid #fff8}
.home-play{left:31%;top:79%;width:38%;height:10%}
.home-stickers{left:26%;top:88%;width:48%;height:8%}
.map-level{width:45%;height:10%;left:28%}
.map1{top:20%}.map2{top:34%}.map3{top:48%}.map4{top:62%}
.map-locked{top:76%}
.top-controls{position:absolute;z-index:10;top:max(10px,env(safe-area-inset-top));left:0;right:0;display:flex;justify-content:space-between;padding:8px 12px;pointer-events:none}
.top-controls button{pointer-events:auto;width:48px;height:48px;border:0;border-radius:16px;background:#fff;box-shadow:0 5px 18px #214b6528;font-size:23px}
.hint-btn{position:relative}.hint-dot{position:absolute;right:5px;top:5px;width:9px;height:9px;border-radius:50%;background:#ff5f5f;box-shadow:0 0 0 3px #fff}
.game-art{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#bfeeff}
.game-art img{width:100%;height:100%;object-fit:contain}
.hotspot{position:absolute;border:0;background:transparent;border-radius:50%;cursor:pointer}
.hotspot.found{animation:found .35s ease forwards;pointer-events:none}
@keyframes found{50%{transform:scale(1.3);box-shadow:0 0 0 8px #ffd34d99}100%{opacity:.25}}
.progress{position:absolute;z-index:9;top:max(13px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:#fff;border-radius:18px;padding:9px 16px;font-weight:1000;color:#234b73;box-shadow:0 5px 18px #214b6528}
.hint-pulse{position:absolute;z-index:12;width:78px;height:78px;border:6px solid #ffd34d;border-radius:50%;pointer-events:none;box-shadow:0 0 0 7px #fff8,0 0 28px #ffb52e}
.win-button{position:absolute;border:0;background:transparent;cursor:pointer}
.win-next{left:24%;top:78%;width:52%;height:8%}.win-map{left:28%;top:87%;width:44%;height:7%}
.toast{position:absolute;z-index:30;left:50%;top:50%;transform:translate(-50%,-50%);background:#fff;border-radius:20px;padding:13px 20px;font-weight:1000;color:#244b75;box-shadow:0 10px 35px #0003;display:none}
.toast.show{display:block;animation:t .95s ease forwards}
@keyframes t{0%,70%{opacity:1}100%{opacity:0;transform:translate(-50%,-65%)}}
@media(min-width:700px){
 .screen{background:#cfefff}
 .art,.game-art img{width:auto;max-width:520px}
}
</style>
</head>
<body>
<div id="app">

<section id="home" class="screen active">
  <img class="art" src="assets/home_bg.png" alt="Стартовый экран">
  <button class="hot home-play" aria-label="Играть" onclick="showMap()"></button>
  <button class="hot home-stickers" aria-label="Мои наклейки" onclick="toast('Наклейки будут открываться по мере прохождения ⭐')"></button>
</section>

<section id="map" class="screen">
  <img class="art" src="assets/map_bg.png" alt="Карта уровней">
  <button class="hot map-level map1" onclick="startPark()"></button>
  <button class="hot map-level map2" onclick="locked()"></button>
  <button class="hot map-level map3" onclick="locked()"></button>
  <button class="hot map-level map4" onclick="locked()"></button>
  <button class="hot map-level map-locked" onclick="locked()"></button>
  <div class="top-controls"><button onclick="showHome()">‹</button></div>
</section>

<section id="game" class="screen">
  <div class="game-art"><img src="assets/park_bg.png" alt="Парк"></div>
  <div class="progress" id="progress">🐥 0 из 5</div>
  <div class="top-controls">
    <button onclick="showMap()">‹</button>
    <button class="hint-btn" onclick="hint()">💡<span class="hint-dot"></span></button>
  </div>

  <!-- Five real duck hotspots on the illustration. They are transparent but clickable. -->
  <button class="hotspot" style="left:70%;top:43%;width:11%;height:8%" data-duck="1"></button>
  <button class="hotspot" style="left:72%;top:91%;width:9%;height:6%" data-duck="2"></button>
  <button class="hotspot" style="left:53%;top:91%;width:9%;height:6%" data-duck="3"></button>
  <button class="hotspot" style="left:40%;top:86%;width:10%;height:7%" data-duck="4"></button>
  <button class="hotspot" style="left:77%;top:94%;width:9%;height:6%" data-duck="5"></button>
  <div id="toast" class="toast"></div>
</section>

<section id="win" class="screen">
  <img class="art" src="assets/win_bg.png" alt="Победа">
  <button class="win-button win-next" onclick="startPark()"></button>
  <button class="win-button win-map" onclick="showMap()"></button>
</section>

<script>
const screens=["home","map","game","win"];
let found=0, hintUsed=false;

function show(id){
  screens.forEach(s=>document.getElementById(s).classList.remove("active"));
  document.getElementById(id).classList.add("active");
}
function showHome(){show("home")}
function showMap(){show("map")}
function startPark(){
  found=0;hintUsed=false;
  document.querySelectorAll(".hotspot").forEach(x=>x.classList.remove("found"));
  updateProgress();show("game");
}
function locked(){toast("Эта локация скоро откроется 🔒")}
function updateProgress(){document.getElementById("progress").textContent=`🐥 ${found} из 5`}
function toast(text){
  const t=document.getElementById("toast");t.textContent=text;t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"),950);
}
document.querySelectorAll(".hotspot").forEach(h=>{
  h.addEventListener("pointerdown",()=>{
    if(h.classList.contains("found"))return;
    h.classList.add("found");found++;updateProgress();
    if(found===5)setTimeout(()=>show("win"),450);
  });
});
function hint(){
  const remaining=[...document.querySelectorAll(".hotspot:not(.found)")][0];
  if(!remaining){toast("Ты уже всё нашёл!");return}
  hintUsed=true;
  const r=remaining.getBoundingClientRect(), a=document.getElementById("game").getBoundingClientRect();
  const p=document.createElement("div");p.className="hint-pulse";
  p.style.left=(r.left-a.left+r.width/2-39)+"px";p.style.top=(r.top-a.top+r.height/2-39)+"px";
  document.getElementById("game").appendChild(p);
  p.animate([{transform:"scale(.65)",opacity:1},{transform:"scale(1.3)",opacity:.15}],{duration:900,iterations:2});
  setTimeout(()=>p.remove(),1900);
}
</script>
</body>
</html>
